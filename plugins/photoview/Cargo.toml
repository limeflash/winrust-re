[package]
rust-version.workspace = true
name = "photoview"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
winrust-common = { path = "../../common" }
winrust-ui = { path = "../../ui" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Time", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# COM only for the image decoder (WIC): JPEG/PNG/GIF/BMP/TIFF, WebP/HEIC/AVIF when the Windows codec is installed
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[package]
name = "rust-term"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
description = "WinRust Terminal: a block terminal on ConPTY (the VT core first)"

[lib]
path = "src/lib.rs"

[dependencies]
vte = "0.15"
unicode-width = "0.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

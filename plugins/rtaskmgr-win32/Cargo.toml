[package]
rust-version.workspace = true
name = "rtaskmgr-win32"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
winrust-common = { path = "../../common" }
winrust-ui = { path = "../../ui" } # the window: host, widgets, Direct2D renderer
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] } # HICON, for the icons of the processes
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "network", "disk"] }
winapi = { version = "0.3", features = ["debugapi", "winsvc", "processthreadsapi", "winbase", "winnt", "handleapi", "shellapi", "errhandlingapi", "minwindef", "winuser", "wingdi", "winreg", "winerror", "sysinfoapi", "minwinbase", "windef", "commctrl", "winver", "psapi", "libloaderapi", "fileapi", "ioapiset", "ntdef", "setupapi", "guiddef", "securitybaseapi", "synchapi"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Time", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_System_Performance"] }

[build-dependencies]
embed-resource = "3"

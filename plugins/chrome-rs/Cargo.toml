[package]
rust-version = "1.100"
name = "chrome-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies]
arboard = "3.7.0"
encoding_rs = "0.8.44"
fontdue = "0.9.5"
miniz_oxide = "0.8"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
resvg = { version = "0.50.0", default-features = false }
rquickjs = { version = "0.14.0", features = ["loader"] }
serde_json = "1.0.154"
softbuffer = "0.4.8"
ureq = { version = "3.5.2", features = ["brotli"] }
winit = "0.30.13"
rustybuzz = "0.20.1"
unicode-linebreak = "0.1"
unicode-bidi = "0.3"
ttf-parser = "0.25"
ab_glyph_rasterizer = "0.1"
woff2-patched = "0.4"


[build-dependencies]
embed-resource = "3"
